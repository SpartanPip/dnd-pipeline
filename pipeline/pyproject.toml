[project]
name = "dnd-pipeline"
version = "0.1.0"
description = "Local recording, transcription, organizing, and image pipeline for dnd-pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "python-frontmatter>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
  "mlx-whisper>=0.4.3",
  "mflux>=0.24",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "numpy>=2",
]

[project.scripts]
dnd-setup = "dnd_pipeline.setup_cli:main"
dnd-worker = "dnd_pipeline.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
